<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>recon2win · web</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>recon2win</h1>
        <span class="subtitle">automated recon · web UI</span>
    </header>

    <form id="run-form">
        <label>
            <span>Target domain</span>
            <input id="domain" name="domain" type="text" placeholder="example.com" required>
        </label>
        <label>
            <span>Extra args (optional)</span>
            <input id="args" name="args" type="text"
                   placeholder="--resume --skip-waymore --skip-nuclei">
        </label>
        <label class="checkbox">
            <input id="tty" name="tty" type="checkbox" checked>
            <span>Force colors (use when not piping)</span>
        </label>
        <button id="run-btn" type="submit">Run scan</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
    </form>

    <div id="status-bar">
        <span id="status">idle</span>
        <span id="meta"></span>
    </div>

    <div id="terminal"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
