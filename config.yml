# ============================================================
#  recon-agent default configuration
# ============================================================

# ---------- Global ----------
output_root: outputs           # root folder under which <domain>/ is created

# ---------- Subdomain collection ----------
subdomain:
  tools:
    - subfinder
    - amass
    - chaos
  # Chaos requires an API key from ProjectDiscovery Cloud.
  # Leave empty if you do not have one.
  chaos_api_key: ""
  timeout: 900

# ---------- puredns (subdomain validator) ----------
# Runs AFTER subfinder/amass/chaos to filter the raw candidate list:
#   * drops hosts that don't actually resolve
#   * drops wildcard subdomains (e.g. ``*.foo.com`` from CT logs)
# The output OVERWRITES ``processed/subdomains.txt`` with the
# validated, deduplicated, wildcard-free list — so downstream stages
# (dnsx, httpx_alive, …) get the clean list, not the 45k raw
# candidates from cert-transparency logs.
# Uses the public **trickest** resolver list (≈5k public DNS resolvers
# curated by trickest — Cloudflare, Quad9, AdGuard, etc.) so we get
# real validation, not just one resolver's view.
puredns:
  enabled: true
  # rate-limit for puredns's mass queries (per second, per resolver).
  rate_limit: 200
  # how many random lookups puredns does to confirm a wildcard
  # pattern. Higher = fewer false-positive wildcard drops, slower.
  wildcard_tests: 3
  # Brute-force common subdomains on top of the input list — uses
  # a wordlist. Off by default (subfinder/amass/chaos is already
  # comprehensive) but useful on small targets.
  bruteforce: false
  # Optional explicit wordlist for --bruteforce mode. Ignored when
  # bruteforce is false. Defaults to a SecLists path.
  wordlist: "wordlists/SecLists/Discovery/DNS/subdomains-top1million-20000.txt"
  # overall stage timeout — puredns against 5k resolvers can take a
  # while. Bump if you're processing huge candidate lists.
  timeout: 1800

# ---------- DNS resolution ----------
dnsx:
  # dnsx flags: -l list -json -resp -silent -r resolver
  threads: 100
  retries: 3
  timeout: 600
  # ------------------------------------------------------------------
  # Cap the number of resolved hosts passed to downstream stages.
  # Targets like apple.com return 45k+ hosts from cert-transparency
  # logs (mostly applebot/courier.push/sandbox noise). Feeding the
  # full list to httpx_alive makes it blow its 600s timeout and never
  # write ``alive.txt`` — every downstream stage then silently skips
  # with "no alive hosts".
  #
  # The full resolved list is still saved to
  # ``processed/resolved_detail.json`` for reference; only the flat
  # ``resolved.txt`` is capped (and prioritised — see
  # ``prioritize_subdomains`` in modules/utils.py for the scoring).
  #
  # Trade-off: higher = more coverage, longer httpx runtime.
  #   10000 → ~95% of valuable hosts covered; fits in 30 min budget
  #   0     → no cap (use only for small curated targets)
  #
  # If the first pass yields 0 alive hosts, main.py automatically
  # retries with ``max_resolved_expanded`` (see below).
  # ------------------------------------------------------------------
  max_resolved: 10000
  # When the first pass yields 0 alive hosts, main.py automatically
  # retries dnsx+httpx_alive with this larger cap. Set to 0 to
  # disable the retry (just keep the first-pass result, however
  # disappointing). The retry is skipped on subsequent passes too.
  max_resolved_expanded: 25000

# ---------- HTTPX alive check ----------
httpx:
  threads: 50
  # Bumped from 600 → 1800. The upstream dnsx stage now caps the
  # host list at 5000 (see dnsx.max_resolved), so 600s is usually
  # fine — but with rate-limited CDNs (Akamai, Cloudflare, Fastly)
  # a single httpx probe can hang 5–10s and 5000 hosts × 50 threads
  # doesn't fit in 600s. 1800s gives 30s/host headroom which is what
  # apple.com, microsoft.com and similar large targets need.
  timeout: 1800
  follow_redirects: true

# ---------- Content discovery ----------
content_discovery:
  katana:
    enabled: true
    depth: 3
    timeout: 1800
  urlfinder:
    enabled: true
    timeout: 1800

# ---------- Dirsearch ----------
dirsearch:
  enabled: true
  threads: 30
  timeout: 3600
  recursive: true
  follow_redirects: true         # follow 3xx so the final status is reported
  # ------------------------------------------------------------------
  # Status-code filtering (dirsearch v3.x — `-i` and `-x`).
  #   include_status: only show these status codes (empty = show all)
  #   exclude_status: hide these status codes (applied after include)
  #
  # Default — hide the noise:
  #   404  → most endpoints return this; useless for hunting
  #   429  → rate-limited response; not a real finding
  # Include only the "interesting" codes:
  #   200  → endpoint exists, anonymous access
  #   401  → endpoint exists, requires authentication
  #   403  → endpoint exists, but access denied
  #   500  → server error (often injection sink)
  # With ``follow_redirects: true`` (above), 3xx responses are followed
  # and the final code is reported — so e.g. /admin → 302 → /login (200)
  # shows up as a 200, which we want to see.
  # ------------------------------------------------------------------
  include_status: [200, 401, 403, 500]
  exclude_status: [404, 429]  # hide 404 noise + rate-limit responses
  # ------------------------------------------------------------------
  # Wordlists (SecLists) — dirsearch will receive one `-w` per file.
  # Paths may point to a single .txt file OR to a directory (directories
  # are recursively expanded to every .txt inside, sorted).
  # `~` is expanded. Non-existent paths are skipped with a warning so a
  # missing SecLists checkout does not break the whole stage.
  #
  # Paths are resolved relative to the repo root (i.e. the directory you
  # ran `python3 main.py` from — typically the folder that contains
  # main.py / config.yml). ``setup.py --all -y`` clones SecLists into
  # ``<repo>/wordlists/SecLists`` by default, which matches the paths
  # below out of the box.
  #
  # Manual clone (if you skipped setup.py):
  #   git clone --depth 1 https://github.com/danielmiessler/SecLists.git wordlists/SecLists
  # ------------------------------------------------------------------
  wordlists:
    - wordlists/SecLists/Discovery/Web-Content/raft-small-directories.txt
    - wordlists/SecLists/Discovery/Web-Content/uri-from-top-55-most-popular-apps.txt
    - wordlists/SecLists/Discovery/Web-Content/Service-Specific
  # If true AND wordlists are present, dirsearch also tries each word
  # with each extension (extremely noisy — leave false unless you know
  # what you are doing).
  combine: false
  # Explicit extensions override the curated list in modules/sensitive_ext.py.
  # Leave empty/null to use the curated sensitive-extension set as a fallback
  # when no wordlists are configured.
  extensions: []

# ---------- Waymore ----------
waymore:
  enabled: true
  timeout: 1800

# ---------- xnLinkFinder ----------
xnlinkfinder:
  enabled: true
  timeout: 1200

# ---------- Arjun ----------
arjun:
  enabled: true
  threads: 5
  rate_limit: 60          # requests per minute
  timeout: 3600
  # Cap the number of dynamic URLs fed to arjun. Without this, an
  # aggressive crawler + waymore can produce 5k+ URLs and arjun will
  # sit fuzzing them for an hour before timing out. The framework
  # ranks the URLs by high-value hints (api/login/admin/etc.) and keeps
  # the top N — raise this if you have a small, curated target list.
  max_urls: 200
  # Per-request HTTP timeout (arjun -T). Default 15s is too generous
  # for archive noise; 10s keeps a single hung URL from eating the
  # whole stage budget.
  request_timeout: 10

# ---------- Nuclei ----------
nuclei:
  # ------------------------------------------------------------------
  # exclude_tags — passed to nuclei as ``-etags``. Filters out
  # templates whose tags match this list. Useful for cutting noise:
  #   interaction — requires user interaction (browser cookie
  #                 acceptance, captcha solving, etc.); useless for
  #                 automated scans
  #   smtp/dns/ftp/ssh/tcp/udp — non-HTTP templates that don't apply
  #                 to a web target
  # Global to BOTH default + dynamic scans (single source of truth).
  # Leave empty to run every template.
  # ------------------------------------------------------------------
  exclude_tags:
    - interaction
    - smtp
    - dns
    - ftp
    - ssh
    - tcp
    - udp
  default:
    enabled: true
    severity:
      - critical
      - high
      - medium
      - low
      - info
    timeout: 7200
  dynamic:
    enabled: true
    tags:
      - fuzz
      - fuzzing
      - sqli
      - xss
      - lfi
      - rce
      - ssrf
      - ssti
      - idor
    severity:
      - critical
      - high
      - medium
      - low
    timeout: 7200
  rate_limit: 100
  bulk_size: 25
  concurrency: 25

# ---------- Telegram ----------
# Secrets (bot_token, chat_id) live in config.local.yml (git-ignored), NOT here.
# config.local.yml is deep-merged over this file — set enabled:true + creds there.
telegram:
  enabled: false                    # turn on in config.local.yml once creds are set
  bot_token: ""                     # set in config.local.yml (create a bot via @BotFather)
  chat_id: ""                       # set in config.local.yml (numeric chat id / group)
  notify_high_critical: true        # immediate alert per high/critical nuclei finding
  notify_summary: true              # milestone summaries at stage-6 and final
  # Per-phase notification — sends one message per stage with count + output
  # paths. Off by default (a full scan produces ~13 messages). Turn on for
  # a "live progress feed" experience; turn off for milestone-only updates.
  per_phase: true

# ---------- HackerOne (optional) ----------
# Pull target scope straight from the H1 Hacker API instead of copy-pasting:
#   python3 main.py --h1-list                 # list your programs
#   python3 main.py --h1-program <handle>     # pick an in-scope root to recon
#
# Only assets flagged eligible_for_submission are used, so out-of-scope hosts
# never enter the pipeline. Credentials (HTTP Basic: token identifier =
# username, token value = password) are read from env vars
# H1_API_USERNAME / H1_API_TOKEN first, then from the keys below.
#
# Do NOT put real credentials here — copy config.local.yml.example to
# config.local.yml (git-ignored) and fill them in there.
hackerone:
  api_username: ""   # API token identifier
  api_token: ""      # API token value
