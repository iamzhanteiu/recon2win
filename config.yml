# ============================================================
#  recon-agent default configuration
# ============================================================

# ---------- Global ----------
output_root: outputs           # root folder under which <domain>/ is created

# ---------- Scope filtering ----------
# Content discovery runs katana with ``-do`` (display-out-scope) ON PURPOSE:
# it emits the out-of-scope JS/assets an in-scope page pulls from a CDN / S3 /
# static host, so the JS-analysis stages can mine the app's own API endpoints
# out of those bundles. The side effect is that the merged URL list also picks
# up pure third-party noise — youtube, facebook, google-analytics, ad/tracking
# hosts — which would otherwise waste httpx / arjun / nuclei budget.
#
# ``filter_urls`` trims ``all_urls.txt`` (and everything downstream) down to
# in-scope + related hosts. Out-of-scope ``.js`` URLs are DELIBERATELY kept in
# ``js_urls.txt`` (so JS analysis still works) but are NOT probed/fuzzed.
scope:
  # Master switch. When true, only in-scope (root + *.root) and related_roots
  # URLs survive into all_urls.txt / dynamic_urls.txt. Set false to keep the
  # old behaviour (everything, including third-party hosts).
  filter_urls: true
  # Extra roots that count as "in scope" — the app's own CDN / S3 / static
  # host, or sister brands you're allowed to test. A host matches if it equals
  # the root or is a subdomain of it. Accepts ``foo.com``, ``.foo.com`` or
  # ``*.foo.com`` (all normalised the same). Example for guildwars2.com:
  #   related_roots:
  #     - staticwars.com
  #     - arena.net
  related_roots: []

# ---------- URL dedup (param templates) ----------
# The crawler + waymore emit the SAME endpoint hundreds of times with only the
# param VALUE changing: ``/e?id=1``, ``/e?id=2``, ... — plus URLs that repeat a
# param name (``/e?p=a&p=b``). Exact-string dedup keeps them all, so the param
# list balloons to 100k+ and arjun/nuclei waste budget re-fuzzing one endpoint.
#
# ``collapse_params`` collapses URLs that share (host, path, param-name set) to
# a single representative — but SMART: a param value is kept distinct when it
# looks like a human keyword (``action=delete`` vs ``action=view``) and only
# folded when it looks like a machine id (number / uuid / hash / long blob).
# It fails toward KEEPING, so an ``?action=admin`` style endpoint is never
# silently dropped. Applies to all_urls.txt + dynamic_urls.txt.
url_dedup:
  collapse_params: true

# ---------- Subdomain collection ----------
subdomain:
  tools:
    - subfinder
    - amass
    - chaos
  # Chaos requires an API key from ProjectDiscovery Cloud. Loaded from the
  # $PDCP_API_KEY env var by default (the same var chaos-client reads) —
  # export it, or hard-code a value here / in config.local.yml. Resolves to
  # "" when the env var is unset, which makes the chaos sub-tool skip.
  chaos_api_key: "${PDCP_API_KEY}"
  timeout: 900

# ---------- puredns (subdomain validator) ----------
# Runs AFTER subfinder/amass/chaos to filter the raw candidate list:
#   * drops hosts that don't actually resolve
#   * drops wildcard subdomains (e.g. ``*.foo.com`` from CT logs)
# The output OVERWRITES ``processed/subdomains.txt`` with the
# validated, deduplicated, wildcard-free list — so downstream stages
# (dnsx, httpx_alive, …) get the clean list, not the 45k raw
# candidates from cert-transparency logs.
# Uses the public **trickest** resolver list (≈5k public DNS resolvers
# curated by trickest — Cloudflare, Quad9, AdGuard, etc.) so we get
# real validation, not just one resolver's view.
puredns:
  enabled: true
  # rate-limit for puredns's mass queries (per second, per resolver).
  rate_limit: 200
  # how many random lookups puredns does to confirm a wildcard
  # pattern. Higher = fewer false-positive wildcard drops, slower.
  wildcard_tests: 3
  # Brute-force common subdomains on top of the input list — uses
  # a wordlist. Off by default (subfinder/amass/chaos is already
  # comprehensive) but useful on small targets.
  bruteforce: false
  # Optional explicit wordlist for --bruteforce mode. Ignored when
  # bruteforce is false. Defaults to a SecLists path.
  wordlist: "wordlists/SecLists/Discovery/DNS/subdomains-top1million-20000.txt"
  # overall stage timeout — puredns against 5k resolvers can take a
  # while. Bump if you're processing huge candidate lists.
  timeout: 1800

# ---------- DNS resolution ----------
dnsx:
  # dnsx flags: -l list -json -resp -silent -r resolver
  threads: 100
  retries: 3
  timeout: 600
  # ------------------------------------------------------------------
  # Cap the number of resolved hosts passed to downstream stages.
  # Targets like apple.com return 45k+ hosts from cert-transparency
  # logs (mostly applebot/courier.push/sandbox noise). Feeding the
  # full list to httpx_alive makes it blow its 600s timeout and never
  # write ``alive.txt`` — every downstream stage then silently skips
  # with "no alive hosts".
  #
  # The full resolved list is still saved to
  # ``processed/resolved_detail.json`` for reference; only the flat
  # ``resolved.txt`` is capped (and prioritised — see
  # ``prioritize_subdomains`` in modules/utils.py for the scoring).
  #
  # Trade-off: higher = more coverage, longer httpx runtime.
  #   10000 → ~95% of valuable hosts covered; fits in 30 min budget
  #   0     → no cap (use only for small curated targets)
  #
  # If the first pass yields 0 alive hosts, main.py automatically
  # retries with ``max_resolved_expanded`` (see below).
  # ------------------------------------------------------------------
  max_resolved: 10000
  # When the first pass yields 0 alive hosts, main.py automatically
  # retries dnsx+httpx_alive with this larger cap. Set to 0 to
  # disable the retry (just keep the first-pass result, however
  # disappointing). The retry is skipped on subsequent passes too.
  max_resolved_expanded: 25000

# ---------- HTTPX alive check ----------
httpx:
  # Bumped from 50 → 80. A real run against acronis.com's 60000-URL
  # (max_url_check-capped) input still only probed 60000/180672 — wait,
  # it probed exactly the max_url_check cap but STILL hit the 1800s
  # timeout before finishing that capped batch (see logs/stages.json:
  # "salvaged 12336 alive URLs from partial output (60000/180672
  # probed)"). More threads shortens wall time for the same request count.
  threads: 80
  # Bumped from 600 → 1800 → 3000. The upstream dnsx stage now caps the
  # host list at 5000 (see dnsx.max_resolved), so 600s is usually
  # fine — but with rate-limited CDNs (Akamai, Cloudflare, Fastly)
  # a single httpx probe can hang 5–10s and 5000 hosts × 50 threads
  # doesn't fit in 600s. 3000s gives real headroom for the URL-check
  # pass (stage 6), which probes up to max_url_check (60000) URLs, not
  # just the smaller host list the alive-check pass (stage 2) sees.
  timeout: 3000
  follow_redirects: true
  # Cap the merged URL list fed to the stage-6 URL alive-check. The
  # crawler + waymore + JS tools can produce 400k+ URLs; probing every
  # one blows the 1800s timeout and leaves alive_urls.txt EMPTY, which
  # in turn STARVES the URL-derived stages downstream. We keep
  # the highest-value URLs first (params / api / admin / auth paths).
  #   0 → no cap (only for small curated targets)
  max_url_check: 60000
  # Drop static-asset URLs (images/fonts/css/media/source-maps — see
  # sensitive_ext.STATIC_EXT) BEFORE the max_url_check cap, so the cap
  # budget goes to real endpoints instead of dead-weight assets that push
  # genuine URLs out of the window. ``.js`` is NEVER dropped (jsluice /
  # xnLinkFinder mine it). Set false to probe every asset too.
  drop_static: true

# ---------- Content discovery ----------
content_discovery:
  katana:
    enabled: true
    depth: 3
    timeout: 1800
    # Extract <form>/<input>/<textarea>/<select> from every crawled page
    # (katana -fx) into processed/forms.json — the POST/upload/login attack
    # surface arjun's GET-param scan never sees. Reuses the SAME crawl (no
    # extra requests): katana runs with -jsonl -fx -ob and we split the
    # output back into the plain URL list + forms.json. Set false to keep
    # the old plain-text crawl (e.g. an old katana without -fx).
    form_extraction: true
  # urlfinder (passive archive) — TẮT vì trùng nguồn với waymore. urlfinder
  # query wayback/commoncrawl/alienvault/urlscan/virustotal; waymore (stage
  # riêng, bật) query ĐÚNG cùng bộ nguồn đó + tải cả response body. Chạy cả
  # hai = gọi lặp cùng archive API (chậm, tốn rate-limit), url_merge dedup
  # nên output cuối không lợi gì. Giữ MỘT passive là đủ. Bật lại nếu tắt
  # waymore, hoặc muốn passive nhanh hơn (bỏ waymore) thay vì sâu hơn.
  urlfinder:
    enabled: false
    timeout: 1800
  # Gom host trả về cùng một response trước khi crawl — crawl 200 host
  # wildcard cùng phục vụ một app lãng phí y như fuzz chúng. max_hosts: 0 =
  # không cap (crawl rẻ hơn fuzz nhiều nên mặc định không giới hạn số host).
  #
  # "Không cap" ở đây là không cap SỐ HOST, không phải không giới hạn: cái
  # bó thật là ``katana.timeout`` ở trên. Đo được ~6s/host (43 host / 258s),
  # nên timeout 1800s đi hết khoảng ~300 host. Quá ngưỡng đó katana bị giết
  # giữa chừng và output vẫn ghi bình thường — stage vẫn "success", chỉ là
  # thiếu một phần không ai biết là bao nhiêu. Trường hợp đó giờ có cảnh
  # báo trên console + ``extra.truncated`` trong stages.json; muốn quét
  # target vài nghìn host thì đặt max_hosts (bó đầu vào, có kiểm soát) chứ
  # đừng để timeout tự cắt (bó đầu ra, ngẫu nhiên).
  dedup_targets: true
  max_hosts: 0
  skip_waf: false

  # gau (passive archive) — TẮT: là tập con yếu nhất của urlfinder/waymore
  # (cùng wayback/commoncrawl/otx/urlscan, không có virustotal, không tải
  # body) và ProjectDiscovery urlfinder chính là bản thay thế hiện đại của
  # nó. Chạy thêm gau chỉ là lượt query thứ 3 vào cùng nguồn. Passive đã do
  # waymore đảm nhiệm. Bật lại chỉ khi tắt cả urlfinder lẫn waymore.
  gau:
    enabled: false
    threads: 5
    timeout: 600

# ---------- Dirsearch ----------
dirsearch:
  enabled: true
  threads: 30
  # dirsearch quét các host trong -l TUẦN TỰ trong một process. `timeout` là
  # TRẦN cho cả stage.
  #
  # Ngân sách thật giờ được SUY RA TỪ KHỐI LƯỢNG REQUEST, không còn là
  # timeout_per_host × số target nữa (xem modules/dirsearch.py _plan_budget):
  #     wanted = số_target × số_từ ÷ max_rate × 1.3
  # Lý do đổi: con số per_host không có cách nào biết wordlist to bao nhiêu.
  # Comment cũ ở đây từng khẳng định "120s × 50 host = 6000s, không bao giờ
  # bị cắt giữa chừng nữa" — nhưng run acronis.com 2026-07-25 vẫn chết đúng
  # ở 6000s, vì khối lượng thật là:
  #     50 target × 13,799 từ = 689,950 request
  #     ở max_rate=30 (giới hạn TOÀN CỤC) = 22,998s = 6.4 giờ  → thiếu ~4×
  # Với max_rate=200 dưới đây: 689,950 ÷ 200 × 1.3 ≈ 4,485s, vừa trần 6000s.
  #
  # timeout_per_host chỉ còn là đường lui khi max_rate=0 (không ghì tốc độ),
  # lúc đó không suy ra được rps nên quay lại cách tính cũ theo host.
  timeout_per_host: 120
  timeout: 6000
  # ------------------------------------------------------------------
  # chunk_size — SỐ HOST MỖI LẦN GỌI dirsearch.
  #
  # Ước lượng ngân sách chuẩn đến mấy cũng không cứu được một run đơn:
  # dirsearch duyệt target TUẦN TỰ, nên bị kill ở giây thứ N là những host
  # chưa tới lượt KHÔNG HỀ được quét. Đo trên acronis.com: 50 target được
  # chọn, kết quả chỉ đến từ target #1, #3, #9 → ~82% host chưa từng chạm
  # tới. discover.com cùng hình dạng (4/43 host có kết quả).
  #
  # Và ngân sách KHÔNG THỂ chuẩn: cả hai run đều chết đúng bằng ``wanted``
  # mà _plan_budget tự tính (4484s và 3856s) dù đã nhân _BUDGET_SLACK 1.3
  # — tốc độ thật không bao giờ đạt max_rate, cùng hiện tượng RPS tụt dần
  # đo được ở nuclei (194 → 113 trong 2 phút khi bị CDN bóp).
  #
  # Chia nhỏ mới là thứ giới hạn thiệt hại: mỗi chunk có ngân sách riêng
  # tính từ chính số host của nó, ghi kết quả ngay sau khi chạy xong, và
  # một chunk chết chỉ tốn đúng chunk đó. Chunk timeout thì các chunk còn
  # lại tự giảm còn một nửa (tới sàn chunk_min_size).
  # ``timeout`` ở trên là trần wall-clock cho CẢ stage, chia cho các chunk.
  #   0 → tắt, quay lại hành vi một-lần cũ.
  # ------------------------------------------------------------------
  chunk_size: 10
  chunk_min_size: 3
  # ------------------------------------------------------------------
  # Phân vai với ffuf (4.3) để không đào trùng cùng một cây thư mục:
  #   dirsearch = FILE + extension nhạy cảm, KHÔNG recursion
  #   ffuf      = DIRECTORY + recursion
  # Trước đây cả hai cùng chạy raft-small-directories với recursion bật —
  # nghĩa là mọi directory tìm được đều bị quét lại hai lần bởi hai tool.
  # ------------------------------------------------------------------
  recursive: false
  follow_redirects: true         # follow 3xx so the final status is reported
  # ------------------------------------------------------------------
  # Chọn target (dùng chung modules/fuzz_targets.py với ffuf).
  #   dedup_targets: gom host trả về CÙNG một response (status/title/words/
  #                  lines/webserver) rồi chỉ fuzz một đại diện. Wildcard DNS
  #                  cho 200 host trỏ về một app là chuyện thường — không có
  #                  bước này thì wordlist bị bắn lại 200 lần y hệt.
  #   max_hosts:     cap sau khi đã dedup + xếp hạng (0 = không cap).
  #   skip_waf:      bỏ host httpx đánh dấu cdn_type=waf. Mặc định false —
  #                  phần lớn chương trình đứng sau Cloudflare, bật lên là
  #                  mất gần hết target.
  # ------------------------------------------------------------------
  dedup_targets: true
  max_hosts: 50
  skip_waf: false
  # Ghì tốc độ. `--max-rate` = req/s TOÀN CỤC (không phải mỗi thread),
  # `--delay` = giây giữa các request (0 = tắt).
  #
  # 30 → 200. 30 req/s là quá thấp so với khối lượng: 689,950 request ở 30
  # req/s = 6.4 giờ, không đời nào lọt trần 6000s, và đó là lý do stage này
  # timeout ở mọi lần chạy. 200 req/s đưa về ~4,485s. Con số này vẫn thấp
  # hơn nuclei.rate_limit (400) đang bắn vào cùng target, nên nhất quán với
  # phần còn lại của pipeline.
  #
  # HẠ XUỐNG khi target là origin nhỏ/yếu hoặc chương trình có policy req/s
  # — timeout sẽ tự giãn theo (ngân sách suy ra từ max_rate), nhưng nhớ
  # kiểm tra dòng cảnh báo "vượt trần" khi chạy. 0 = không ghì (khi đó
  # ngân sách rơi về timeout_per_host × số host).
  max_rate: 200
  delay: 0
  # ------------------------------------------------------------------
  # Status-code filtering (dirsearch v3.x — `-i` and `-x`).
  #   include_status: only show these status codes (empty = show all)
  #   exclude_status: hide these status codes (applied after include)
  #
  # Default — hide the noise:
  #   404  → most endpoints return this; useless for hunting
  #   429  → rate-limited response; not a real finding
  # Include only the "interesting" codes:
  #   200  → endpoint exists, anonymous access
  #   401  → endpoint exists, requires authentication
  #   403  → endpoint exists, but access denied
  #   500  → server error (often injection sink)
  # With ``follow_redirects: true`` (above), 3xx responses are followed
  # and the final code is reported — so e.g. /admin → 302 → /login (200)
  # shows up as a 200, which we want to see.
  # ------------------------------------------------------------------
  include_status: [200, 401, 403, 500]
  exclude_status: [404, 429]  # hide 404 noise + rate-limit responses
  # ------------------------------------------------------------------
  # Wordlists (SecLists) — dirsearch will receive one `-w` per file.
  # Paths may point to a single .txt file OR to a directory (directories
  # are recursively expanded to every .txt inside, sorted).
  # `~` is expanded. Non-existent paths are skipped with a warning so a
  # missing SecLists checkout does not break the whole stage.
  #
  # Paths are resolved relative to the repo root (i.e. the directory you
  # ran `python3 main.py` from — typically the folder that contains
  # main.py / config.yml). ``setup.py --all -y`` clones SecLists into
  # ``<repo>/wordlists/SecLists`` by default, which matches the paths
  # below out of the box.
  #
  # Manual clone (if you skipped setup.py):
  #   git clone --depth 1 https://github.com/danielmiessler/SecLists.git wordlists/SecLists
  # ------------------------------------------------------------------
  # Vai trò FILE → wordlist thiên về tên file, không phải tên thư mục.
  # quickhits.txt là file đáng ưu tiên nhất trong SecLists: ~2.4k entry nhưng
  # toàn .git/config, .env, backup pattern, actuator — tỉ lệ finding/request
  # cao nhất. Service-Specific/ (~50 file) đã bỏ: nạp wordlist Spring cho host
  # PHP là request phí; xem ghi chú tech-aware trong README.
  wordlists:
    - wordlists/SecLists/Discovery/Web-Content/quickhits.txt
    - wordlists/SecLists/Discovery/Web-Content/raft-small-files.txt
  # If true AND wordlists are present, dirsearch also tries each word
  # with each extension (extremely noisy — leave false unless you know
  # what you are doing).
  combine: false
  # Explicit extensions override the curated list in modules/sensitive_ext.py.
  # Leave empty/null to use the curated sensitive-extension set as a fallback
  # when no wordlists are configured.
  extensions: []

# ---------- ffuf ----------
# Stage 4.3 — runs in parallel with dirsearch, not instead of it. ffuf takes
# ONE url per process (`-u <base>/FUZZ`), so this stage fans out over
# alive.txt: `max_hosts` targets, `concurrency` ffuf processes at a time,
# `timeout` seconds each.
ffuf:
  enabled: true
  threads: 40                 # -t, per ffuf process
  timeout: 1800               # ngân sách MỖI HOST (giây)
  # Trần cho CẢ stage. Không có nó thì worst case là
  # max_hosts / concurrency × timeout = 50/3 × 1800 = 8.5 giờ, trong khi 3
  # stage còn lại của phase 4 đã xong từ lâu. Hết giờ thì không khởi động
  # target mới nữa; target đang chạy được để chạy nốt.
  budget_seconds: 3600
  max_hosts: 50               # cap SAU khi dedup + xếp hạng (0 = không cap)
  concurrency: 3              # ffuf processes running at once
  # Giống dirsearch — xem giải thích ở khối dirsearch phía trên.
  dedup_targets: true
  skip_waf: false
  # ------------------------------------------------------------------
  # Auto-calibration — the reason ffuf earns its slot next to dirsearch.
  # Before fuzzing, ffuf requests a batch of random paths and derives
  # filters from what comes back, so a host that answers 200 + identical
  # body to everything (SPA fallback, soft-404, WAF landing page) yields
  # 0 hits instead of the entire wordlist.
  #   autocalibration         → -ac
  #   autocalibration_per_host→ -ach  (recalibrate per host; implies -ac)
  #   autocalibration_strategy→ -acs  (ffuf 2.x: "basic" | "advanced";
  #                                    leave empty to use ffuf's default)
  # ------------------------------------------------------------------
  autocalibration: true
  autocalibration_per_host: true
  autocalibration_strategy: ""
  # ------------------------------------------------------------------
  # Recursive directory fuzzing — every matched directory is queued and
  # fuzzed again, up to `recursion_depth` levels.
  #
  # IMPORTANT: ffuf spots a directory via the redirect a matched response
  # points at, so `follow_redirects: true` (-r) breaks recursion — the
  # redirect is consumed before ffuf can read it. Keep it false while
  # recursion is on, and keep 301/302 in match_status or nothing ever
  # gets queued for the next level.
  #   recursion_strategy → -recursion-strategy ("default" | "greedy";
  #                        greedy also recurses into non-directory hits)
  # ------------------------------------------------------------------
  recursion: true
  recursion_depth: 2
  recursion_strategy: ""
  follow_redirects: false
  # -rate. 0 = không giới hạn = cách nhanh nhất để ăn ban rồi phải chạy lại
  # từ đầu. Nhiều chương trình bug bounty ghi rõ trần req/s trong policy.
  # 30 req/s × 3 process = 90 req/s tổng — chỉnh theo policy của target.
  rate: 30
  # -mc / -fc. Matchers run first, filters trim what survived.
  #   200 exists · 301/302 needed for recursion · 401/403 exists but
  #   gated · 405 wrong method (endpoint is real) · 500 often a sink
  match_status: [200, 204, 301, 302, 307, 401, 403, 405, 500]
  filter_status: [404, 429]
  # -fr: lọc theo NỘI DUNG body thay vì kích thước. Cần cho target trả JSON
  # soft-404 kiểu {"error":"not found","path":"/<đã-thử>"} — body echo path
  # nên độ dài đổi mỗi request, -ac (lọc theo size) bó tay. Ví dụ: '"error"'
  filter_regex: ""
  # Same resolution rules as dirsearch.wordlists: file or directory,
  # `~` expanded, missing paths skipped with a warning, several files
  # merged into one deduped list under raw/ffuf/merged_wordlists.txt.
  # Vai trò DIRECTORY + recursion → wordlist phải NHỎ. Mỗi directory match
  # được sẽ chạy lại TOÀN BỘ wordlist ở tầng sau, nên kích thước bị nhân lên
  # theo số thư mục tìm thấy. common.txt (~4.6k) chịu được phép nhân đó;
  # raft-small-directories (~20k) thì không: 20k × 50 host × số dir = hàng
  # chục triệu request.
  wordlists:
    - wordlists/SecLists/Discovery/Web-Content/common.txt
  # -e, appended to every word (".php,.bak"). Dotted or bare both work.
  # Multiplies the request count by len(extensions) + 1 — keep it short.
  extensions: []

# ---------- Response preview ----------
# ffuf/dirsearch only report status + URL. To triage a hit (is a 200 a real
# page or a soft-404? what does that 403 body actually say?) you want a
# glimpse of the body. This stage re-requests the ffuf + dirsearch hits with
# httpx -bp (body-preview): only the first ~snippet_bytes chars of the body
# come back — NO full response bodies are fetched or stored. Writes a preview
# table (status/size/type/title/snippet) to responses/index.md.
#
# Runs after content discovery (needs processed/ffuf_urls.txt +
# dirsearch_urls.txt). Skips cleanly when both are empty. Disable with
# enabled:false. max_urls caps how many hits get probed (highest-value first:
# sensitive-looking paths win).
responses:
  enabled: true
  max_urls: 500          # cap how many ffuf/dirsearch hits to probe (0 = no cap)
  threads: 40
  timeout: 900           # overall stage budget (seconds)
  request_timeout: 10    # per-request httpx timeout
  snippet_bytes: 50      # chars of the response body to keep as preview

# ---------- Waymore ----------
waymore:
  enabled: true
  timeout: 1800

# ---------- xnLinkFinder ----------
xnlinkfinder:
  enabled: true
  timeout: 1200

# ---------- jsluice (AST-based JS analysis) ----------
# Runs in parallel with xnLinkFinder (stage 6). Where xnLinkFinder greps
# JS with regex, jsluice parses each file into a tree-sitter AST — so it
# resolves URLs built dynamically (BASE + path, template literals) and
# extracts secrets (API keys/tokens) with context.
#
# jsluice does NOT fetch JS itself: the framework downloads every URL in
# js_urls.txt into raw/jsluice/ first, then runs jsluice over the local
# files. Discovered URLs/endpoints are merged back into all_urls.txt (so
# they get httpx-probed + nuclei-scanned); secrets land in
# findings/jsluice_secrets.json and fire a Telegram alert if configured.
#
# Install:  go install github.com/BishopFox/jsluice/cmd/jsluice@latest
jsluice:
  enabled: true
  # Which analyses to run. Drop "secrets" to only harvest endpoints, or
  # "urls" to only scan for leaked credentials.
  mode:
    - urls
    - secrets
  # Per-file HTTP timeout when downloading each JS bundle (seconds).
  fetch_timeout: 10
  # Cap how many JS files to fetch+parse. A crawl-heavy target can yield
  # thousands of .js URLs; the top N (discovery order) keeps the stage
  # bounded. 0 = no cap.
  max_js: 500
  # Overall stage budget (fetch + both jsluice passes).
  timeout: 1200

# ---------- Arjun ----------
arjun:
  enabled: true
  threads: 5
  rate_limit: 60          # arjun --rate-limit: max requests per SECOND (0 = arjun default 9999)
  timeout: 3600
  # arjun --stable. KHÔNG phải "cẩn thận hơn một chút": requester của arjun
  # đặt delay = random 3–9 GIÂY trước MỖI request (arjun/core/requester.py),
  # nên nó nuốt luôn ý nghĩa của rate_limit ở trên. Đo thật trên
  # acronis.com 2026-07-25: ~660s cho MỘT url (103 chunk wordlist/url) →
  # budget 3600s chỉ đủ ~5 url trong khi max_urls = 200.
  # Bật lại KHI VÀ CHỈ KHI target chặn rate (arjun in "try --stable switch"
  # / "Target has rate limiting in place"), và khi bật thì nhớ hạ max_urls
  # xuống ~20 cho khớp budget.
  stable: false
  # Vá bug upstream của arjun (≤2.2.7) trước khi chạy: __main__.py in
  # ``request.status_code`` trong khi request là dict → AttributeError giết
  # cả process ngay khi target trả 400/413/418/429/503 (WAF, rate limiter,
  # endpoint 400 khi thấy param lạ — gặp hằng ngày). Vá sửa đúng một biểu
  # thức thành ``response_1.status_code``, giữ .recon2win.bak, idempotent,
  # và không đụng gì nếu arjun đã fix. false = không ghi vào site-packages
  # (khi đó chunking vẫn giới hạn thiệt hại, nhưng mỗi chunk vẫn chết sớm).
  patch_upstream: true
  # Sàn thời gian cho một chunk. Các chunk chia đều phần budget CÒN LẠI,
  # nhưng chunk nào không xin nổi ngần này giây thì bỏ hẳn thay vì khởi
  # động để chết: run cũ có chunk nhận đúng 1s rồi timeout, và stage báo
  # "timeout after 1s" nghe như lỗi cấu hình.
  min_chunk_seconds: 120
  # Cap the number of dynamic URLs fed to arjun. Without this, an
  # aggressive crawler + waymore can produce 5k+ URLs and arjun will
  # sit fuzzing them for an hour before timing out. The framework
  # ranks the URLs by high-value hints (api/login/admin/etc.) and keeps
  # the top N — raise this if you have a small, curated target list.
  max_urls: 200
  # Per-request HTTP timeout (arjun -T). Default 15s is too generous
  # for archive noise; 10s keeps a single hung URL from eating the
  # whole stage budget.
  request_timeout: 10
  # Số URL mỗi lần gọi arjun. arjun 2.2.7 CRASH hẳn process trên một số
  # target và kéo theo toàn bộ target còn lại. CÓ HAI CRASH KHÁC NHAU, cả
  # hai đều được vá tự động (patch_upstream, xem modules/arjun.py):
  #   (B) __main__.py:135 — in request.status_code khi target trả non-2xx,
  #       nhưng request lúc đó là dict:
  #         AttributeError: 'dict' object has no attribute 'status_code'
  #       Giết run acronis.com 2026-07-25 ở target 2/200.
  #   (A) __main__.py:133 — response_1.status_code, trong khi requester()
  #       trả về STR khi lỗi mạng (hoặc 'killed' khi cờ kill bật vì
  #       503/timeout). Upstream có kiểm type nhưng mãi tận dòng 139:
  #         AttributeError: 'str' object has no attribute 'status_code'
  #       Đây mới là cái giết chunk SAU KHI (B) đã vá — run discover.com
  #       2026-07-26 mất 2/8 chunk vì nó.
  # → 198 target không bao giờ được quét, mất 22 phút, arjun_params.txt
  # không hề được tạo. Bug đó nay đã được vá (xem patch_upstream ở trên),
  # nhưng arjun còn nhiều đường chết khác (error_handler bật cờ kill toàn
  # cục khi gặp 503/timeout) nên vẫn giữ chunking để giới hạn thiệt hại:
  # 25 URL/lần → một URL độc chỉ giết chunk của nó.
  # ``-oT`` ghi nối tiếp nên finding của các chunk trước vẫn còn nguyên.
  # ``timeout`` ở trên vẫn là trần cho CẢ stage (các chunk chia nhau).
  #   0 → tắt chunking, gọi arjun một lần như trước.
  chunk_size: 25

# ---------- Nuclei ----------
nuclei:
  # Refresh the nuclei template store (``nuclei -update-templates``) once
  # at the start of each run. Stale templates miss recently-published CVEs
  # — the biggest silent quality drain on a scanner. Fast no-op when
  # already current. Set false on air-gapped hosts or to pin a version.
  update_templates: true
  update_timeout: 600
  # ------------------------------------------------------------------
  # Batching (áp cho scan nuclei default — scan nuclei duy nhất còn lại).
  # nuclei's ``-json-export`` is written once at process exit, so a single
  # run that walls at its timeout persists NOTHING — the "salvaged 0
  # partial findings" failure a real acronis.com run hit on every scan.
  # Splitting the URL list into bounded batches makes each batch run to
  # completion and persist its findings BEFORE the next starts, so a later
  # timeout never wipes the earlier results.
  #   batch_size       URLs per batch. 0 → disable (single run, old
  #                    behaviour). Smaller = safer (less lost per timeout)
  #                    but more nuclei template-load overhead (~10-30s each).
  #   batch_timeout    timeout PER BATCH (seconds). The per-scan ``timeout``
  #                    below still bounds a single non-batched run.
  #   batch_on_timeout continue → keep going after a timed-out batch (max
  #                    coverage). stop → halt the stage but keep what's done.
  #   batch_min_size   sàn khi tự chia đôi (xem dưới). 0/1 → không có sàn.
  #
  # TỰ CHIA ĐÔI KHI TIMEOUT: batch timeout không có nghĩa là "17% URL cuối
  # chưa quét". nuclei duyệt theo TEMPLATE, quét từng template qua toàn bộ
  # target trong batch — nên bị kill là cụt ĐUÔI DANH SÁCH TEMPLATE cho
  # MỌI URL trong batch, và thứ tự template không ngẫu nhiên nên lần nào
  # cũng mất đúng phần đuôi đó. Vì vậy khi một batch timeout, các batch
  # còn lại tự giảm còn một nửa (tới sàn batch_min_size) để mỗi batch đi
  # hết bộ template. Tổng số request không đổi; cái được là coverage mỗi
  # URL, trả giá bằng một lần load template thừa mỗi batch (~10-30s).
  # ------------------------------------------------------------------
  batch_size: 1000
  batch_timeout: 1800
  batch_on_timeout: continue
  batch_min_size: 25
  # ------------------------------------------------------------------
  # batch_autotune — kiểm bất biến batch_size TRƯỚC khi quét, thay vì để
  # operator phát hiện sau vài giờ xem mọi batch chết ở batch_timeout.
  # Trước khi chạy, code đo corpus thật bằng `nuclei -tl -severity ...
  # -tags ...` (đúng lệnh ghi trong các comment bên dưới, ~1-3s, có cache)
  # rồi so với công thức:
  #
  #     batch_size × req_per_template × templates / rate_limit
  #         ≤ 0,7 × batch_timeout
  #
  # Vượt thì batch_size tự hạ xuống mức vừa, kèm cảnh báo nói rõ vì sao.
  # CHỈ THU NHỎ, không tự phóng to: batch nhỏ hơn tối ưu chỉ tốn thêm vài
  # lượt load template (~10-30s), còn batch to hơn thì mất đuôi danh sách
  # template cho MỌI URL trong batch — đắt hơn nhiều.
  #
  # Vì sao cần: mọi con số batch_size dưới đây đúng cho ĐÚNG bộ tags +
  # severity + rate_limit hiện tại. Sửa `tags` một dòng là corpus đổi kích
  # thước còn batch_size đứng yên. Đó chính là cách một scan nuclei từng
  # có 6/6 batch timeout với 0 finding.
  #
  # Không áp dụng khi bật `-dast` (nuclei.default.dast): `-tl` lờ đi -dast nên
  # phép đo sai hai bậc độ lớn — code tự bỏ qua, batch_size giữ nguyên.
  # false → tắt hẳn, dùng batch_size như đã ghi.
  batch_autotune: true
  # req_per_template — số request THẬT cho mỗi (template × target). KHÔNG
  # phải 1: redirect, retry, matcher nhiều bước nhân nó lên. Đo bằng
  # `nuclei -stats` rồi chia RequestsTotal / (target × template):
  #     default   1.162.000 / (100 × 5.095) = 2,28
  #     theo URL     34.510 / ( 10 × 1.078) = 3,20
  # Ghi đè trong từng scan bên dưới khi số đo khác.
  req_per_template: 2.3
  # ------------------------------------------------------------------
  # exclude_tags — passed to nuclei as ``-etags``. Filters out
  # templates whose tags match this list. Useful for cutting noise:
  #   interaction — requires user interaction (browser cookie
  #                 acceptance, captcha solving, etc.); useless for
  #                 automated scans
  #   smtp/dns/ftp/ssh/tcp/udp — non-HTTP templates that don't apply
  #                 to a web target
  # Global — nuclei.default ghi đè được từng key nếu cần.
  # Leave empty to run every template.
  # ------------------------------------------------------------------
  exclude_tags:
    - interaction
    - smtp
    - dns
    - ftp
    - ssh
    - tcp
    - udp
  default:
    enabled: true
    # 2026-07-28: BẬT ĐỦ CẢ 5 SEVERITY theo yêu cầu.
    #
    # Ghi chú cũ ở đây nói "info là phần lớn bộ ~9k template, bật vào là
    # scan chết ở timeout". Điều đó ĐÚNG khi chưa có ``tags`` bên dưới, và
    # SAI kể từ khi có. Đo bằng ``nuclei -tl`` ngày 2026-07-28:
    #
    #                                    có tags   không tags
    #   critical,high,medium               5.524       7.400
    #   critical,high,medium,info          7.511      12.419
    #   + low  (tức đủ 5)                  7.879          —
    #
    # Tag filter hấp thụ gần hết phần phình ra: đủ 5 severity chỉ +43%
    # template (5.524 → 7.879) thay vì +68% như khi không lọc tag.
    # Chi phí thời gian tương ứng ~+43%. Số đo thật trên discover.com
    # (157 host, 5.525 template, một run không batch): ~80 phút ⇒ đủ 5
    # severity là ~115 phút, vẫn dư xa dưới ``timeout: 25200`` (7h).
    #
    # ĐÁNH ĐỔI ĐÃ BIẾT: phần lớn cái thêm vào là template phát hiện
    # công nghệ/phiên bản — nhiều finding, ít cái báo cáo được. Đọc report
    # thì lọc theo severity trước, đừng đọc từ trên xuống.
    #
    # KHI ĐỔI ``tags`` thì phải đo lại: bỏ tag filter đi mà vẫn để đủ 5
    # severity là vọt lên trên 12.419 template, tức đúng cái kịch bản làm
    # scan chết mà ghi chú cũ mô tả.
    severity:
      - critical
      - high
      - medium
      - low
      - info
    # Template tag filter. severity=critical,high,medium STILL leaves
    # ~7400 templates (measured: `nuclei -tl -severity critical,high,medium`
    # → 7401), and 562 alive hosts × 7401 templates at rate_limit=100 is
    # ~4.2M requests ≈ 11.6h of pure request time — no way it finishes in
    # the 3h timeout, which is why the acronis.com run salvaged 0 findings.
    # Narrowing to the attack-relevant tag classes below cuts to ~5200
    # templates (drops tech/version-detection noise, wordpress-plugin
    # enumeration, etc. — nothing you'd report). Leave empty to run every
    # critical/high/medium template (slow; only for a small curated host list).
    #
    # TÊN TAG PHẢI KHỚP CHÍNH XÁC tag trong template — nuclei bỏ qua tag lạ
    # trong im lặng, không cảnh báo. Đo bằng `nuclei -tl -severity
    # critical,high,medium -tags <tag>`:
    #     misconfig  → 622 template     misconfiguration → 4    (SAI)
    #     panel      →  39 template     exposed-panels   → 0    (SAI)
    # Config trước đây dùng hai cái sai nên chúng hoàn toàn vô tác dụng;
    # salesforce-community-misconfig chỉ lọt lưới nhờ có kèm tag `exposure`.
    # Sửa lại: 5148 → 5431 template.
    tags:
      - cve
      - exposure
      - misconfig
      - default-login
      - panel
      - takeover
    # Batch by host so each run is separately bounded and persisted.
    #
    # SIZING (measured, not estimated — `nuclei -stats` on a real 100-host
    # batch of this target reported: templates=5095, total=1,162,000
    # requests, sustained ~500 rps). Two things that earlier guesses got
    # wrong:
    #   * a template is NOT one request — 1,162,000 / (100 × 5095) = ~2.3
    #     requests per template per host (redirects, retries, multi-step
    #     matchers), so the true cost is ~11,600 requests per host;
    #   * at ~500 rps that is ~23 s/host, so a 100-host batch needs ~39min
    #     and could never fit the 30min batch_timeout — every batch died at
    #     ~75% done, which is why all 6 timed out.
    # 50 hosts × 23s ≈ 19min leaves real headroom inside batch_timeout.
    # 562 hosts → 12 batches ≈ 4h. Raise batch_timeout, not batch_size, if
    # you want fewer/longer batches.
    #
    # ------------------------------------------------------------------
    # 2026-07-27: ĐẶT 0 — MỘT LỆNH nuclei DUY NHẤT, KHÔNG CHIA BATCH.
    #
    # Lý do batching tồn tại là để một run bị timeout không xoá sạch kết
    # quả. Lý do đó đã hết hiệu lực: output đi qua ``-jsonl -o``, thứ
    # nuclei ghi DẦN theo từng finding (xem ghi chú trong
    # _build_nuclei_cmd). Một run bị SIGKILL vẫn để lại nguyên phần đã
    # tìm được — batching chỉ còn mua thêm chi phí.
    #
    # Chi phí đó đo được, không phải suy đoán. Run 2026-07-27 trên
    # discover.com với batch 39 host: 30,7 s/host, so với 24,8 s/host của
    # batch 50 host cùng target. Batch NHỎ HƠN lại tốn NHIỀU HƠN mỗi host
    # — vì mỗi batch phải nạp lại toàn bộ 5.525 template (~10-30s) và chi
    # phí đó không chia đều theo số host. 157 host một lượt ≈ 80 phút, dư
    # xa dưới ``timeout: 25200``.
    #
    # Đặt lại > 0 khi quét target đủ lớn để một run không kịp trong
    # ``timeout`` — lúc đó batching mới trả lại giá trị của nó.
    # ``batch_autotune`` tự bỏ qua khi batch_size = 0.
    # ------------------------------------------------------------------
    batch_size: 0
    batch_timeout: 1800
    # TRẦN CHO CẢ STAGE, batched hay không. Trước đây nó chỉ bó đường
    # un-batched: run batched chạy tự do batches × batch_timeout, nên
    # một stage nuclei của discover.com đốt 4h dưới một ``timeout`` danh
    # nghĩa 3h. Giờ mỗi batch chỉ được cấp phần còn lại của ngân sách
    # stage, và stage dừng thay vì mở batch ngắn hơn cả lúc load template.
    #
    # 10800 (3h) LÀ QUÁ THẤP CHO STAGE NÀY khi trần đã có hiệu lực thật.
    # Đo trên run acronis.com: 14 batch, mọi batch exit 0, tổng 17.219s =
    # 4,78h. Ép 3h sẽ cắt mất ~5 batch của một scan đang chạy LÀNH LẶN —
    # tức là biến một trần chống chạy loạn thành mất coverage.
    # 25200 = 14 batch × batch_timeout 1800, tức trần bao được cả trường
    # hợp xấu nhất mà vẫn chặn được run thoát ly.
    # Công thức khi đổi batch_size: timeout ≥ ceil(số host / batch_size)
    #                                        × batch_timeout
    timeout: 25200
  # ------------------------------------------------------------------
  # Ba cần gạt kiểm soát độ ồn, ánh xạ thẳng sang cờ nuclei:
  #     rate_limit  → -rl / -rate-limit   trần request/giây (toàn cục)
  #     concurrency → -c                  số template chạy song song
  #     bulk_size   → -bs / -bulk-size    số host song song mỗi template
  #
  # 2026-07-27: HẠ 400/25/25 → 100/10/10 để tránh bị chặn.
  #
  # Vì sao không chỉ hạ rate_limit: phép đo `-stats` trên 3 host thật cho
  # thấy connection reuse chỉ 11,1% (22.335 kết nối TCP MỚI trên 25.125
  # request). Với WAF thì tốc độ mở kết nối mới là tín hiệu mạnh hơn cả
  # rps — nên `concurrency` và `bulk_size` phải xuống cùng, không thì
  # nuclei vẫn dựng 25 luồng đập cửa cùng lúc, chỉ là chậm hơn.
  #
  # Bối cảnh target: 93/157 host discover.com trả 403 ngay lần probe đầu
  # của httpx, 10 host trả 503, chỉ 23 host trả 200. Đây là hạ tầng đã
  # sẵn tư thế từ chối, không đáng để bắn 400 rps vào.
  #
  # CHI PHÍ, đo chứ không đoán: `nuclei -stats` trên 3 host với đúng bộ
  # cờ này báo 36.906 request / 3 host = 12.302 request mỗi host. Nhân
  # 157 host = 1,93 triệu request.
  #     @400 rps → 1,3 giờ      (đã đo thật: run 26/07 hết 64 phút)
  #     @100 rps → 5,4 giờ      ← hiện tại
  # Vẫn vừa trong ``nuclei.default.timeout: 25200`` (7 giờ), còn dư 1,6h.
  # HẠ THÊM NỮA thì phải nâng timeout theo: @50 rps là 10,7 giờ, vượt
  # trần và stage sẽ bị cắt giữa chừng.
  #
  # Thời gian tỉ lệ nghịch TUYẾN TÍNH với rate_limit — đây vẫn là cần gạt
  # mạnh nhất về thời lượng. Ghi đè riêng dưới nuclei.default nếu cần
  # (key theo scan thắng key chung).
  # ------------------------------------------------------------------
  rate_limit: 100
  bulk_size: 10
  concurrency: 10

# ---------- Telegram ----------
# Secrets load from env ($TELEGRAM_BOT_TOKEN / $TELEGRAM_CHAT_ID) by default,
# or override in config.local.yml (git-ignored, deep-merged over this file).
# Both resolve to "" when unset, which keeps Telegram disabled (see _enabled).
telegram:
  enabled: false                    # turn on here/config.local.yml once creds are set
  bot_token: "${TELEGRAM_BOT_TOKEN}"  # $TELEGRAM_BOT_TOKEN (bot via @BotFather)
  chat_id: "${TELEGRAM_CHAT_ID}"      # $TELEGRAM_CHAT_ID (numeric chat id / group)
  notify_high_critical: true        # immediate alert per high/critical nuclei finding
  notify_summary: true              # milestone summaries at stage-6 and final
  # Per-phase notification — sends one message per stage with count + output
  # paths. Off by default (a full scan produces ~13 messages). Turn on for
  # a "live progress feed" experience; turn off for milestone-only updates.
  per_phase: true

# ---------- HackerOne (optional) ----------
# Pull target scope straight from the H1 Hacker API instead of copy-pasting:
#   python3 main.py --h1-list                 # list your programs
#   python3 main.py --h1-program <handle>     # pick an in-scope root to recon
#
# Only assets flagged eligible_for_submission are used, so out-of-scope hosts
# never enter the pipeline. Credentials (HTTP Basic: token identifier =
# username, token value = password) are read from env vars
# H1_API_USERNAME / H1_API_TOKEN first, then from the keys below.
#
# Do NOT put real credentials here — copy config.local.yml.example to
# config.local.yml (git-ignored) and fill them in there.
hackerone:
  api_username: "${H1_API_USERNAME}"   # $H1_API_USERNAME — API token identifier
  api_token: "${H1_API_TOKEN}"         # $H1_API_TOKEN — API token value
