# Tooling config for recon2win. Packaging still lives in setup.py; this file
# only configures ruff (lint) so CI and local runs share one source of truth.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# ruff's default rule set (E4, E7, E9, F) — real errors and high-signal style,
# no noisy line-length/whitespace churn.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# setup.py inserts the project root on sys.path *before* importing project
# modules, so its imports legitimately come after executable statements.
"setup.py" = ["E402"]
